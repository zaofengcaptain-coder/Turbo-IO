# ---------------------------------------------------------------------------
# Turbo IO · iOS V2（官方 App 扩展）在 Windows 上的构建入口
#
# Windows 不能直接编译 iOS（没有 Xcode / iOS SDK / codesign）。
# 本工作流把「必须用 macOS 的那一小段」搬到 GitHub Actions 的 macOS runner 上：
#
#   1. 下载作者提供的原厂砸壳 IPA（1.0.5 / 201，未合并扩展）
#   2. 用 xcrun clang 编译 TurboIOPrivateAddon.dylib（embedded 模式）
#   3. 把 dylib 注入 Runner.app（macho-embed.mjs）
#   4. 产出 IPA：unsigned（交给 Windows 用 Apple ID 签名）或 signed（付费证书在 CI 内签）
#
# 你只需要在 Windows 上：把本文件放进 fork 的 .github/workflows/ → 网页点 Run workflow → 下载产物。
#
# 合规：仅用于自己的设备与非商业学习研究。产出的 IPA 属于你的私有包，
#       不要把它、签名报告、描述文件提交到任何公开仓库。
# ---------------------------------------------------------------------------

name: Build Turbo IO iOS V2

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '扩展变体'
        type: choice
        default: standard
        options:
          - standard            # 官方扩展标准版：建议先用这个
          - local-translation   # 额外启用本地翻译（需 iOS 26+，模型自备）
      sign_mode:
        description: '签名方式'
        type: choice
        default: unsigned
        options:
          - unsigned   # CI 只注入不签名，回 Windows 用爱思助手 / AltServer 以 Apple ID 签（7 天）
          - signed     # CI 内用你的付费开发者证书 + 描述文件签名，需配置 4 个 Secrets
      device_udid:
        description: '仅 signed 模式需要：iPhone UDID（爱思助手设备信息里可查）'
        required: false
        type: string
      bundle_id:
        description: '自定义 Bundle ID（免费账号注册不了 com.rayneo.venus.pub 时换一个没人占用的）'
        required: false
        default: io.turboio.venus.pub
        type: string
      runner:
        description: 'macOS runner；若报 deployment target 不支持，改 macos-15 / macos-14 再试'
        required: false
        default: macos-latest
        type: string

permissions:
  contents: read

concurrency:
  group: turbo-io-ios-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90

    env:
      # 作者提供的原厂砸壳 IPA（只有解密，没有合并任何 Turbo IO 扩展）
      HOST_IPA_URL: https://github.com/Turbo1123/Turbo-IO/releases/download/rayneo-ios-1.0.5-201/RayNeo_AI_1.0.5_201_decrypted_original.ipa
      HOST_IPA_SHA256: 39d12aff8f2b312dc3b40ce784a444e52c536e61378434005255177548df966a
      BUNDLE_ID: ${{ inputs.bundle_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Toolchain
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path
          node -v
          python3 -V
          command -v plutil codesign nm ditto unzip security shasum

      # ---------------------------------------------------------------- 1. 宿主 IPA
      - name: Download and verify stock decrypted IPA
        run: |
          set -euo pipefail
          mkdir -p host
          curl -fL --retry 3 --retry-delay 5 -o host/original.ipa "$HOST_IPA_URL"
          echo "$HOST_IPA_SHA256  host/original.ipa" | shasum -a 256 -c -
          unzip -q host/original.ipa -d host/src
          APP="$PWD/host/src/Payload/Runner.app"
          [ -d "$APP" ] || { echo "::error::IPA 内缺少 Payload/Runner.app"; exit 1; }
          echo "version = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "build   = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          echo "bundle  = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"

      # ---------------------------------------------------------------- 2. 编译 dylib
      - name: Build TurboIOPrivateAddon.dylib
        env:
          TIO_LOCAL_TRANSLATION: ${{ inputs.variant == 'local-translation' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash official-addon/build.sh embedded "$BUNDLE_ID"
          if [ "${TIO_LOCAL_TRANSLATION:-0}" = "1" ]; then
            echo "ADDON=$PWD/official-addon/build/local-translation/TurboIOPrivateAddon.dylib" >> "$GITHUB_ENV"
          else
            echo "ADDON=$PWD/official-addon/build/embedded/TurboIOPrivateAddon.dylib" >> "$GITHUB_ENV"
          fi

      - name: Locate addon
        run: |
          ls -l "$ADDON"
          /usr/bin/nm -g "$ADDON" | grep -c '^' || true

      # ------------------------------------------------- 3a. unsigned：只注入，不签名
      - name: Embed addon (unsigned output)
        if: ${{ inputs.sign_mode == 'unsigned' }}
        run: |
          set -euo pipefail
          rm -rf out
          node official-addon/macho-embed.mjs \
            "$PWD/host/src/Payload/Runner.app" \
            "$PWD/out/Payload/Runner.app" \
            "$ADDON" \
            "$BUNDLE_ID"
          # macho-embed 已把 CFBundleIdentifier 改成 $BUNDLE_ID。
          # 再做两个 sideload 兼容补丁：
          #   1) 删 UISupportedDevices 机型白名单（iPhone 17 等新机型不在官方名单里，会报
          #      DeviceNotSupportedByThinning 拒装）
          #   2) UIBackgroundModes 去掉 remote-notification（免费账号没有 aps-environment 权限）
          python3 - <<'PY'
          import plistlib, os
          p = os.path.join(os.environ['GITHUB_WORKSPACE'], 'out', 'Payload', 'Runner.app', 'Info.plist')
          with open(p, 'rb') as f:
              d = plistlib.load(f)
          removed_devices = d.pop('UISupportedDevices', None)
          bm = d.get('UIBackgroundModes')
          dropped_push = False
          if bm and 'remote-notification' in bm:
              bm.remove('remote-notification')
              dropped_push = True
          with open(p, 'wb') as f:
              plistlib.dump(d, f)
          print('bundle id   =', d['CFBundleIdentifier'])
          print('devices     =', 'removed (%d entries)' % len(removed_devices) if removed_devices else 'not present')
          print('push mode   =', 'removed' if dropped_push else 'not present')
          print('bg modes    =', d.get('UIBackgroundModes'))
          PY
          /usr/bin/ditto -c -k --norsrc --noextattr --keepParent \
            "$PWD/out/Payload" "$PWD/out/TurboIO-iOS-V2-unsigned.ipa"
          shasum -a 256 "$PWD/out/TurboIO-iOS-V2-unsigned.ipa" | tee "$PWD/out/SHA256.txt"
          # 顺便准备一个小体积的 sideload kit（dylib + 补丁后的 plist），
          # 方便在 Windows 上对既有 IPA 做原位替换，避免重复下载 336MB 大包
          mkdir -p kit
          cp "$ADDON" kit/TurboIOPrivateAddon.dylib
          cp out/Payload/Runner.app/Info.plist kit/Info.plist
          shasum -a 256 kit/* | tee kit/SHA256.txt
          echo "::notice::未签名 IPA 已生成。回 Windows 后用爱思助手 / AltServer 以你的 Apple ID 签名安装（免费账号 7 天有效期）。"

      - name: Upload sideload kit (dylib + patched Info.plist)
        if: ${{ inputs.sign_mode == 'unsigned' }}
        uses: actions/upload-artifact@v4
        with:
          name: TurboIO-sideload-kit-${{ inputs.variant }}
          path: kit/
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------- 3b. signed：CI 内用付费证书签
      - name: Import signing identity
        if: ${{ inputs.sign_mode == 'signed' }}
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::缺少 Secret: $v"; exit 1; }
          done
          [ -n "${{ inputs.device_udid }}" ] || { echo "::error::signed 模式必须填 device_udid"; exit 1; }

          KC="$RUNNER_TEMP/ci.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC"

          EXISTING="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$KC" $EXISTING

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/embedded.mobileprovision"

          IDENTITY="$(security find-identity -v -p codesigning "$KC" \
            | awk '/Apple Development|iPhone Developer/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::未能从 p12 解析出签名身份 SHA1"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$RUNNER_TEMP/embedded.mobileprovision" >> "$GITHUB_ENV"

      - name: Embed, sign and package (signed output)
        if: ${{ inputs.sign_mode == 'signed' }}
        run: |
          set -euo pipefail
          rm -rf out
          node official-addon/package.mjs \
            --app  "$PWD/host/src/Payload/Runner.app" \
            --addon "$ADDON" \
            --profile "$PROFILE_PATH" \
            --identity "$IDENTITY" \
            --device "${{ inputs.device_udid }}" \
            --bundle "$BUNDLE_ID" \
            --out "$PWD/out"
          shasum -a 256 "$PWD/out/TurboIO-local-only.ipa" | tee "$PWD/out/SHA256.txt"

      - name: Cleanup keychain
        if: ${{ always() && inputs.sign_mode == 'signed' }}
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/embedded.mobileprovision" || true

      # ---------------------------------------------------------------- 4. 产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboIO-iOS-V2-${{ inputs.variant }}-${{ inputs.sign_mode }}
          path: |
            out/**/*.ipa
            out/*.ipa
            out/**/*.txt
            out/*.txt
            out/**/*.json
            out/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Turbo IO iOS V2 构建完成"
            echo ""
            echo "- 变体: \`${{ inputs.variant }}\`"
            echo "- 签名: \`${{ inputs.sign_mode }}\`"
            echo "- 宿主: 雷鸟 AI iOS 1.0.5 (201) / \`$BUNDLE_ID\`"
            echo ""
            echo "产物在 Actions 页面底部的 Artifacts 区下载。"
            echo ""
            echo "> 这是你自己的私有包，请勿公开分发。"
          } >> "$GITHUB_STEP_SUMMARY"
